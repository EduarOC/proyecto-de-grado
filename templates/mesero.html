
<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Pantalla Mesero</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
    <nav class="admin-nav" style="background:#2980b9;"><h2>Pantalla del Mesero <a href="/logout" style="color:white; float:right; font-size:14px;">Salir</a></h2></nav>
    <main class="admin-container">
        <h3>Pedidos Listos en Barra</h3>
        <div id="waiter-orders" style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;"></div>
    </main>
    <script>
        function loadOrders() {
            fetch('/api/orders?status=Listo para Entregar').then(res => res.json()).then(orders => {
                const container = document.getElementById('waiter-orders'); container.innerHTML = '';
                orders.forEach(o => {
                    container.innerHTML += `
                        <div class="chef-card" style="border-left: 5px solid #2980b9;">
                            <h4>Llevar a Mesa ${o.table}</h4>
                            <p>${o.items}</p>
                            <button style="background:#2980b9;" onclick="updateStatus(${o.id}, 'Entregado')">Confirmar Entrega üMΩÔ∏è</button>
                        </div>`;
                });
            });
        }
        function updateStatus(id, status) { fetch('/api/update_order', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, status})}); }
        setInterval(loadOrders, 2000); loadOrders();
    </script>
</body></html>
