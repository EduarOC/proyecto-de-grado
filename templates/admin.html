
<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Panel Admin</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
    <nav class="admin-nav"><h2>Gerencia - Visión Global <a href="/logout" style="color:white; float:right; font-size:14px;">Salir</a></h2></nav>
    <main class="admin-container">
        <h3>Generador de Códigos QR</h3>
        <p>Escanea este QR con tu celular para ver el menú como un cliente real:</p>
        <img src="/qr/4" alt="QR Mesa 4" style="width:150px; border-radius:10px; margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
        
        <h3>Todas las Ordenes (Historial)</h3>
        <table class="orders-table">
            <thead><tr><th>Mesa</th><th>Platos</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody id="orders-body"></tbody>
        </table>
    </main>
    <script>
        function loadOrders() {
            fetch('/api/orders').then(res => res.json()).then(orders => {
                const tbody = document.getElementById('orders-body'); tbody.innerHTML = '';
                orders.forEach(o => {
                    tbody.innerHTML += `<tr><td>Mesa ${o.table}</td><td>${o.items}</td><td>$${o.total.toLocaleString()}</td><td><span class="badge ${o.status.replace(' ','').toLowerCase()}">${o.status}</span></td></tr>`;
                });
            });
        }
        setInterval(loadOrders, 2000); loadOrders();
    </script>
</body></html>
