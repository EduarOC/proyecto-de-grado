
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Staff Restaurante</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
    <div class="login-box">
        <h2>Portal del Empleado</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Usuario (admin, chef, mesero)" required>
            <input type="password" name="password" placeholder="Contraseña (1234)" required>
            <button type="submit">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
