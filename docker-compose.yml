services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identityhub
      POSTGRES_USER: identityhub
      POSTGRES_PASSWORD: identityhub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identityhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identityhub
      KC_DB_USERNAME: identityhub
      KC_DB_PASSWORD: identityhub_dev_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    environment:
      DATABASE_URL: postgresql://identityhub:identityhub_dev_password@postgres:5432/identityhub
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
