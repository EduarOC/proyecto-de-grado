# Blueprint de Render (Infraestructura como Código).
# Al conectar este repositorio en Render, detecta este archivo y configura
# el servicio automáticamente: build, start command, plan gratuito y una
# secret_key generada de forma segura (nunca hardcodeada en el repo).
services:
  - type: web
    name: restaurante-qr-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
